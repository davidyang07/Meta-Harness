[project]
name = "meta_harness_backend"
version = "0.1.0"
description = "Meta-Harness backend (FastAPI + LangGraph orchestration + meta-harness CLI)"
requires-python = ">=3.11"
dependencies = [
    "meta_harness",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "typer>=0.15",
    "anthropic>=0.40",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pytest>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "httpx>=0.27",
]
# Experiment tracking is optional on purpose: the repository, its tests
# and every CLI command run without a W&B account, without credentials
# and without network access. Install with `uv sync --extra wandb` and
# enable with META_HARNESS_WANDB=1 (or --wandb).
wandb = [
    "wandb>=0.18",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# No test here should take minutes. Several spawn subprocesses (the
# proposer, verify, git) or wait on Postgres, and a hung one used to
# stall CI until the job-level timeout killed it with no attribution.
# "thread" rather than the default "signal" because signal-based
# timeouts do not work on Windows.
timeout = 300
timeout_method = "thread"

[project.scripts]
meta-harness = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
    "pytest-timeout>=2.3",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
meta_harness = { workspace = true }
