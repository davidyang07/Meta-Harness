[project]
name = "meta-harness-monorepo"
version = "0.1.0"
description = "Meta-Harness — LangGraph-native substrate for self-improving agent harnesses (workspace root)"
requires-python = ">=3.11"
dependencies = [
    "meta_harness",
    "meta_harness_backend",
]

# Experiment tracking is optional. `uv sync` gives a working repository
# with no W&B account, no credentials and no network; `uv sync --extra
# wandb` adds the backend that `META_HARNESS_WANDB=1` then logs to.
[project.optional-dependencies]
wandb = [
    "meta_harness_backend[wandb]",
]

[tool.uv.workspace]
members = ["sdk", "backend"]

[tool.uv.sources]
meta_harness = { workspace = true }
meta_harness_backend = { workspace = true }
