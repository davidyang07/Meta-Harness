# Meta-Harness local stack: the FastAPI backend and the Postgres it
# checkpoints into (AsyncPostgresSaver checkpointer + PostgresStore
# cross-run memory).
#
# Usage:
#   # everything, building the backend image. The backend binds 0.0.0.0
#   # inside its container, so it refuses to start without an API token:
#   export META_HARNESS_API_TOKEN="$(openssl rand -hex 32)"
#   docker compose -f infra/docker-compose.yml up -d --build
#   docker compose -f infra/docker-compose.yml logs -f backend
#   curl localhost:8000/health                      # unauthenticated
#   curl -H "Authorization: Bearer $META_HARNESS_API_TOKEN" localhost:8000/runs
#
#   # database only, for running the CLI and the test suite on the host
#   docker compose -f infra/docker-compose.yml up -d postgres
#
#   docker compose -f infra/docker-compose.yml down     # stop
#   docker compose -f infra/docker-compose.yml down -v  # stop and wipe data
#
# No credentials are baked into the image. The backend reads its
# configuration from the environment; ANTHROPIC_API_KEY is passed through
# from the host (or an .env file next to this one) and is empty unless you
# set it — the API itself does not need it, only live model runs do.
#
# Both ports are published on the host's loopback interface only. Neither
# service is meant to be reachable from other machines: Postgres has a
# well-known password, and the API can start runs that spend money. To
# expose the API deliberately, change the backend's binding here and keep
# META_HARNESS_API_TOKEN set.

services:
  postgres:
    image: postgres:16
    container_name: meta-harness-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: meta_harness
      POSTGRES_PASSWORD: meta_harness
      POSTGRES_DB: meta_harness
    ports:
      # Published so the host CLI and `pytest` can reach the same
      # database the backend container uses — on loopback only.
      - "127.0.0.1:5432:5432"
    volumes:
      - meta_harness_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meta_harness -d meta_harness"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      # The repository root, because the uv workspace spans sdk/ and
      # backend/ and the root uv.lock pins both.
      context: ..
      dockerfile: infra/Dockerfile
    image: meta-harness-backend:local
    container_name: meta-harness-backend
    restart: unless-stopped
    depends_on:
      postgres:
        # Not just "started": the backend degrades to in-memory
        # checkpointing if Postgres is unreachable at startup, which
        # disables checkpoint history, forking and branch recovery.
        condition: service_healthy
    environment:
      # `postgres` is the compose service name, not localhost — localhost
      # inside the container is the container.
      POSTGRES_DSN: postgresql://meta_harness:meta_harness@postgres:5432/meta_harness
      META_HARNESS_PORT: "8000"
      # Passed through from the host environment or an .env file beside
      # this one; empty is fine, and is the default. Only live model runs
      # need it, and none are started by bringing the stack up.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      META_HARNESS_INNER_MODEL: ${META_HARNESS_INNER_MODEL:-}
      # Required: every route but /health then needs
      # `Authorization: Bearer <token>`. Without it the backend exits at
      # startup rather than serve an unauthenticated API on 0.0.0.0. Not
      # `:?`-required here, so `up -d postgres` alone still works.
      META_HARNESS_API_TOKEN: ${META_HARNESS_API_TOKEN:-}
      # Browser origins the dashboard is served from; empty means
      # http://localhost:3000 and http://127.0.0.1:3000.
      META_HARNESS_CORS_ORIGINS: ${META_HARNESS_CORS_ORIGINS:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Run artifacts are the interesting output of a run and should
      # survive the container.
      - meta_harness_runs:/app/runs
    healthcheck:
      test: ["CMD", "python", "/app/infra/healthcheck.py"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

volumes:
  meta_harness_pgdata:
  meta_harness_runs:
