name: backend

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

# An explicit `shell: bash` runs every step as `bash -eo pipefail`. The
# implicit default is `bash -e` without pipefail, under which
# `pytest ... | tee log` reports tee's status and a failed pytest passes.
defaults:
  run:
    shell: bash

jobs:
  pytest:
    name: pytest (Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: meta_harness
          POSTGRES_PASSWORD: meta_harness
          POSTGRES_DB: meta_harness
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meta_harness -d meta_harness"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      POSTGRES_DSN: postgresql://meta_harness:meta_harness@localhost:5432/meta_harness
      # Live-model tests must never run in CI. The repo owner can enable
      # them locally; no API key is configured here by design.
      ANTHROPIC_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync --frozen

      - name: Assert Postgres is actually reachable
        # The Postgres-backed suites skip themselves when the DSN is
        # unreachable. Without this gate a broken service container turns
        # into a green build that tested none of the persistence layer.
        run: |
          cd backend
          uv run python - <<'PY'
          import asyncio, sys
          from app.meta_harness.persistence import healthcheck
          if not asyncio.run(healthcheck()):
              print("Postgres unreachable at POSTGRES_DSN", file=sys.stderr)
              sys.exit(1)
          print("Postgres reachable")
          PY

      - name: Run tests
        # The whole suite rather than a list of files, so a test file
        # added later runs without anyone remembering to list it. -rs
        # prints every skip with its reason for the guard below.
        run: |
          cd backend
          uv run pytest tests/ -q -rs --junitxml=../pytest-report.xml 2>&1 | tee ../pytest.log

      - name: Assert tests ran and the Postgres-backed ones did not skip
        # Guards the same failure mode from the other side. Every
        # Postgres-backed test skips with "Postgres not reachable" when
        # the DSN is down, and a suite that skipped all of persistence,
        # forking, inner checkpointing, the version graph and exact
        # replay would otherwise still be green. Keyed on the skip reason,
        # not on a list of files that a rename silently empties.
        run: |
          if ! grep -qE '(^|[^0-9])[1-9][0-9]* passed' pytest.log; then
            echo "::error::no test passed; the suite verified nothing"
            exit 1
          fi
          if grep -q 'Postgres not reachable' pytest.log; then
            echo "::error::Postgres-backed tests were skipped; persistence was not verified"
            grep 'Postgres not reachable' pytest.log | head -20
            exit 1
          fi

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml

  offline-integrity:
    name: offline suites (no Postgres, no network, no W&B)
    runs-on: ubuntu-latest
    env:
      # Deliberately hostile. These suites must pass with no database, no
      # API key, no W&B account and no network — that is the property
      # under test, not an accident of the runner.
      ANTHROPIC_API_KEY: ""
      POSTGRES_DSN: "postgresql://unreachable:unreachable@127.0.0.1:1/none"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: The whole suite, offline
        # Exact replay, recording, tracking and evidence derivation among
        # it. Only the Postgres-backed tests may skip here; everything
        # else, including test files added later, must pass with no
        # database, no key and no network.
        run: |
          cd backend
          uv run pytest tests/ -q --no-header -rs 2>&1 | tee ../offline.log
          if ! grep -qE '(^|[^0-9])[1-9][0-9]* passed' ../offline.log; then
            echo "::error::no test passed offline; nothing was verified"
            exit 1
          fi

      - name: The W&B adapter degrades cleanly when wandb is absent
        run: |
          uv run meta-harness report wandb-check --output /tmp/wandb-probe.json
          uv run python -c "
          import json
          probe = json.load(open('/tmp/wandb-probe.json'))
          assert probe['ok'], probe
          assert probe['wandb_installed'] is False, 'this job installs no extras'
          print('wandb absent, repository still works:', probe['detail'])
          "

  wandb-offline:
    name: W&B offline logging (no credentials, no network)
    runs-on: ubuntu-latest
    env:
      WANDB_MODE: offline
      WANDB_SILENT: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen --extra wandb

      - name: Probe the adapter in offline mode
        run: |
          uv run meta-harness report wandb-check --output /tmp/wandb-probe.json
          uv run python -c "
          import json
          probe = json.load(open('/tmp/wandb-probe.json'))
          assert probe['ok'] and probe['wandb_installed'], probe
          assert probe['mode'] == 'offline', probe
          assert probe['logged'] == 3, probe
          print('offline W&B run created; version', probe['wandb_version'])
          "

  capability-evidence:
    name: capability claims agree with the artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: No claim may be marked FAIL
        # FAIL means an artifact exists and contradicts the claim.
        run: |
          uv run meta-harness report capability-evidence --json > evidence.json
          uv run python -c "
          import json
          report = json.load(open('evidence.json'))
          failed = [c for c in report['checks'] if c['status'] == 'FAIL']
          for check in failed:
              print('::error::' + check['claim'] + ': ' + check['detail'])
          counts = report['counts']
          print(counts['PASS'], 'PASS,', counts['FAIL'], 'FAIL,', counts['UNSUPPORTED'], 'UNSUPPORTED')
          raise SystemExit(1 if failed else 0)
          "

      - name: No row grades a measurement against a target
        # An evidence document with a bar to clear has an interest in its
        # own answer, and every later decision about tasks, trials and
        # selection gets made in that bar's shadow. There is no target
        # anywhere in this repository and none may be reintroduced.
        run: |
          uv run python -c "
          import json
          report = json.load(open('evidence.json'))
          bad = []
          for check in report['checks']:
              text = (check['claim'] + ' ' + check['detail']).lower()
              if '>=' in text or 'at least' in text or 'target' in text:
                  bad.append(check['claim'])
          for claim in bad:
              print('::error::threshold-shaped claim: ' + claim)
          raise SystemExit(1 if bad else 0)
          "

      - name: The evidence derives, and its artifacts carry no absolute paths
        # docs/evidence/*.json is committed; a path like C:\Users\... or
        # /home/... in it is the writing machine leaking into the record.
        run: ONLY=evidence bash scripts/verify.sh

      - name: The documented command names still resolve
        # docs/, README and CI all name these. A rename that leaves a
        # documented command dead is a broken document, not a cleanup.
        run: |
          for cmd in "report capability-evidence" "report resume-evidence" \
                     "canonical-experiment" "resume-experiment"; do
            uv run meta-harness $cmd --help >/dev/null \
              || { echo "::error::meta-harness $cmd does not resolve"; exit 1; }
          done

  benchmark-schema:
    name: benchmark schema + published results
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: Validate the committed benchmark protocols
        run: |
          cd backend
          uv run pytest tests/test_experiment.py tests/test_holdout_isolation.py \
            -q --no-header

      - name: No committed task declares an expected outcome
        # A `baseline_pass_rate` in a task spec is a target sitting inside
        # the measuring instrument: nothing reads it, so nothing catches
        # a task set being tuned until it produces the wanted number.
        run: |
          uv run python -c "
          import json, pathlib, sys
          banned = ('baseline_pass_rate', 'best_known_pass_rate',
                    'calibration_note', 'expected_pass_rate', 'target_pass_rate')
          bad = {}
          for parent in ('tasks', 'holdout'):
              for spec in sorted(pathlib.Path('eval', parent).glob('*/task.json')):
                  data = json.loads(spec.read_text())
                  present = [f for f in banned if f in data]
                  if present:
                      bad[str(spec)] = present
          for path, fields in bad.items():
              print('::error::' + path + ' declares ' + ', '.join(fields))
          sys.exit(1 if bad else 0)
          "

      - name: Re-derive every published summary from its raw rows
        # A published number must be recomputable from the committed
        # trial rows. If it is not, the evidence does not support it.
        run: |
          uv run python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, "backend")
          from app.meta_harness import experiment as exp

          results = sorted(p for p in Path("benchmarks/results").glob("*") if p.is_dir())
          if not results:
              print("no published results yet — nothing to verify")
              raise SystemExit(0)

          failed = False
          for d in results:
              summary = json.loads((d / "summary.json").read_text())
              env = json.loads((d / "environment.json").read_text())
              recomputed = exp.summarize(
                  baseline_rows=exp.read_rows(d / "baseline-results.jsonl"),
                  candidate_rows=exp.read_rows(d / "candidate-results.jsonl"),
                  task_ids=[t["task_id"] for t in env["tasks"]],
                  baseline_label=summary["baseline_label"],
                  candidate_label=summary["candidate_label"],
              )
              for key in (
                  "baseline_passes", "baseline_trials",
                  "candidate_passes", "candidate_trials",
                  "baseline_accuracy", "candidate_accuracy",
                  "absolute_percentage_point_delta",
              ):
                  if recomputed[key] != summary[key]:
                      print(f"::error::{d}: {key} {summary[key]!r} != recomputed {recomputed[key]!r}")
                      failed = True

              # A published result must also record whether its two arms
              # ran the same protocol. Without that the delta is not
              # attributable to the harness, whatever it recomputes to.
              validation_path = d / "validation.json"
              if not validation_path.exists():
                  print(f"::error::{d}: no validation.json; the methodology is unrecorded")
                  failed = True
              elif not json.loads(validation_path.read_text()).get("identical_protocol"):
                  print(f"::error::{d}: the two arms did not run an identical protocol")
                  failed = True

              print(f"{d.name}: verified")
          raise SystemExit(1 if failed else 0)
          PY

  docker:
    name: backend image builds and actually serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, then prove the container is a working backend
        # `docker build` going green proves only that the layers ran. The
        # smoke script additionally checks the process is non-root, that
        # no credential is baked into a layer, that the container reaches
        # Postgres and reports persistence "postgres" rather than the
        # in-memory fallback, and that the healthcheck refuses to call a
        # Postgres-less backend healthy.
        #
        # The image is built with `uv sync --frozen`, so a lockfile that
        # has drifted from the manifests fails here rather than shipping
        # an image whose dependencies differ from the tested ones.
        run: bash scripts/docker_smoke.sh

  hygiene:
    name: repository hygiene
    runs-on: ubuntu-latest
    # Each check reads `git ls-files` into a variable and greps that.
    # Under pipefail, `git ls-files | grep -q` fails whenever grep exits
    # at the first match and git takes a SIGPIPE, turning a hit into a
    # silent pass.
    steps:
      - uses: actions/checkout@v4

      - name: No committed .env
        run: |
          files="$(git ls-files)"
          if grep -qE '(^|/)\.env$' <<<"$files"; then
            echo "::error::a .env file is tracked"; exit 1
          fi

      - name: No API key patterns
        run: |
          if git grep -nE 'sk-ant-[A-Za-z0-9_-]{20,}' -- . ':(exclude).github/workflows/*'; then
            echo "::error::an Anthropic API key pattern is committed"; exit 1
          fi

      - name: No W&B run directories are tracked
        run: |
          files="$(git ls-files)"
          if grep -qE '(^|/)wandb/' <<<"$files"; then
            echo "::error::a local W&B run directory is tracked"; exit 1
          fi

      - name: No execution tapes are tracked
        # A tape holds every model response verbatim. It belongs under
        # runs/ or benchmark-results/, both of which are gitignored.
        run: |
          files="$(git ls-files)"
          if grep -qE '(^|/)tape\.jsonl$' <<<"$files"; then
            echo "::error::an execution tape is tracked"; exit 1
          fi

      - name: No generated run or benchmark artifacts
        run: |
          files="$(git ls-files)"
          if grep -qE '^(runs|benchmark-results)/' <<<"$files"; then
            echo "::error::generated run artifacts are tracked"; exit 1
          fi

      - name: The derived capability-evidence document is not committed
        run: |
          if git ls-files --error-unmatch docs/CAPABILITY_EVIDENCE.md >/dev/null 2>&1; then
            echo "::error::docs/CAPABILITY_EVIDENCE.md is generated and must not be committed"; exit 1
          fi

      - name: Only committed harnesses under agents/
        run: |
          extra="$(git ls-files agents/ | grep -vE '^agents/(__init__|baseline)\.py$' || true)"
          if [ -n "$extra" ]; then
            echo "::error::proposer-generated candidates are tracked: $extra"; exit 1
          fi

      - name: No tool caches or OS junk
        run: |
          files="$(git ls-files)"
          if grep -qE '(^|/)(\.DS_Store|Thumbs\.db|__pycache__|graphify-out|\.pytest_cache|\.pytest-tmp|node_modules|\.next)(/|$)' <<<"$files"; then
            echo "::error::generated caches are tracked"; exit 1
          fi

      - name: The evidence layer is tracked, not local-only
        # These paths were once listed in a developer's .git/info/exclude
        # as "local-only artifacts". They are not: three jobs in this
        # workflow import or run them. Untracking them again turns this
        # workflow red in ways that look unrelated to the cause.
        run: |
          missing=0
          for path in \
            backend/app/meta_harness/evidence.py \
            backend/tests/test_capability_evidence.py \
            docs/evidence/README.md
          do
            if ! git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              echo "::error::$path is not tracked"; missing=1
            fi
          done
          exit $missing

      - name: Containerisation files are present
        run: |
          for path in infra/Dockerfile infra/healthcheck.py .dockerignore \
                      scripts/docker_smoke.sh; do
            [ -f "$path" ] || { echo "::error::missing $path"; exit 1; }
          done

      - name: The single verification entry point exists and parses
        # `make verify` is what the README tells a reviewer to run. If it
        # is missing or has a syntax error, the README is lying.
        run: |
          for path in Makefile scripts/verify.sh; do
            [ -f "$path" ] || { echo "::error::missing $path"; exit 1; }
          done
          bash -n scripts/verify.sh
          bash -n scripts/docker_smoke.sh
          bash -n scripts/demo_acceptance.sh
          bash -n scripts/live_smoke.sh
          make -n verify >/dev/null

      - name: verify.sh refuses an unknown stage instead of running nothing
        # ONLY=<typo> once ran zero stages and printed VERIFIED.
        run: |
          rc=0
          ONLY=no-such-stage bash scripts/verify.sh || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error::ONLY=<unknown stage> exited 0"; exit 1
          fi

      - name: live_smoke.sh without credentials says SKIPPED and exits 0
        # By design: no key means nothing was attempted, not a failure.
        env:
          ANTHROPIC_API_KEY: ""
        run: |
          out="$(bash scripts/live_smoke.sh)"
          echo "$out"
          grep -q 'SKIPPED' <<<"$out"
          grep -q 'Nothing was verified' <<<"$out"
