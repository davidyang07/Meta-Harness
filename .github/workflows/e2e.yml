name: e2e

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: playwright (mock + live backend)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: meta_harness
          POSTGRES_PASSWORD: meta_harness
          POSTGRES_DB: meta_harness
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meta_harness -d meta_harness"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      POSTGRES_DSN: postgresql://meta_harness:meta_harness@localhost:5432/meta_harness
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
      # The live-backend suite runs the deterministic mock proposer and
      # mock benchmark, so it needs no model access. None is configured.
      ANTHROPIC_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/dashboard/package-lock.json

      - name: Install dashboard deps
        run: npm ci
        working-directory: frontend/dashboard

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend/dashboard

      - name: Start the backend
        run: |
          cd backend
          uv run meta-harness serve --port 8000 > "$RUNNER_TEMP/backend.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 1
          done

      - name: Assert the backend is Postgres-backed
        # The live-backend suite is only meaningful against real
        # checkpointing. A silent fallback to in-memory would let it pass
        # while proving nothing about persistence or forking.
        run: |
          body="$(curl -sf http://127.0.0.1:8000/health)"
          echo "$body"
          echo "$body" | grep -q '"persistence":"postgres"' || {
            echo "::error::backend fell back to in-memory checkpointing"
            cat "$RUNNER_TEMP/backend.log"
            exit 1
          }

      - name: Playwright — mock fixtures
        run: npx playwright test --project=mock
        working-directory: frontend/dashboard

      - name: Playwright — live backend
        run: npx playwright test --project=live-backend
        working-directory: frontend/dashboard

      - name: Acceptance API flow
        run: API_URL=http://127.0.0.1:8000 uv run python scripts/acceptance_api_flow.py

      - name: Backend log
        if: failure()
        run: cat "$RUNNER_TEMP/backend.log"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/dashboard/playwright-report/
          retention-days: 7
